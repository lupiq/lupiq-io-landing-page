name: Release

# relwolf opens/updates a release pull request and, once that is merged, tags the commit and creates the GitHub release.
#
# The token is created from a GitHub App (variable RELWOLF_APP_CLIENT_ID, secret RELWOLF_APP_PRIVATE_KEY), so the
# release pull requests are not authored by a maintainer.
# Required app permissions: contents: write, pull requests: write, issues: write (labels and assignees).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Force the next version, e.g. 1.0.0 ("auto" removes a request)'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELWOLF_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELWOLF_APP_PRIVATE_KEY }}
      - uses: lupiq/relwolf@v0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-as: ${{ inputs.release-as }}
