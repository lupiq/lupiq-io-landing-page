# yaml-language-server: $schema=https://relwolf.lupiq.io/schema.json
branch: main

# Content and dependency updates (Renovate uses `build`) are published and therefore trigger a patch release
patch-types: [fix, build, docs]

release-emoji: true

assignees:
  - nioe

reviewers:
  - nioe

packages:
  '.':
    updaters:
      - type: package-json
