branch: main

# Content and dependency updates (Renovate uses `build`) are published and therefore trigger a patch release
patch-types: [fix, build, refactor, style, perf]

release-emoji: true

# Runs Prettier over the generated changelog before the release commit
pre-commit-script: scripts/format.sh

assignees:
  - nioe

reviewers:
  - nioe

packages:
  '.':
    updaters:
      - type: package-json
      - type: generic
        path: src/app-version.ts
